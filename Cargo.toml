[package]
name = "ophis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
dashmap = "6.2.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.150"
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
